# White House Example - Automations
# PLACEHOLDER: Replace entity IDs (person.*, lock.*, climate.*, sensors) with your own.
# Safe by default: notify only, no lock toggling.
# See docs/examples/white-house/README.md

- alias: "Departure Guard: Locks And HVAC"
  id: wh_departure_guard_locks_hvac
  mode: single
  trigger:
    - platform: state
      entity_id:
        - person.placeholder_person_1  # PLACEHOLDER: replace with your person entities
        - person.placeholder_person_2
      to: "not_home"
      for: "00:02:00"
  condition:
    - condition: state
      entity_id: input_boolean.wh_notifications_enabled
      state: "on"
    - condition: template
      value_template: >
        {{ is_state('person.placeholder_person_1', 'not_home')
           and is_state('person.placeholder_person_2', 'not_home') }}
    - condition: or
      conditions:
        - condition: state
          entity_id: lock.wh_front_main_lock  # PLACEHOLDER: replace with your lock
          state: "unlocked"
        - condition: state
          entity_id: lock.wh_back_main_lock  # PLACEHOLDER: replace with your lock
          state: "unlocked"
        - condition: template
          value_template: >
            {{ states('climate.wh_hvac_main_thermo') not in ['off', 'away'] }}
  action:
    - service: notify.wh_household
      data:
        message: >
          Departure Guard: someone left and something is still "open."
          Front lock: {{ states('lock.wh_front_main_lock') }}.
          Back lock: {{ states('lock.wh_back_main_lock') }}.
          HVAC: {{ states('climate.wh_hvac_main_thermo') }}.

- alias: "Leak Alert: Notify on Water Detection"
  id: wh_leak_alert_notify
  mode: single
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.wh_utilities_waterheater_sensleak  # PLACEHOLDER
        - binary_sensor.wh_kitchen_sink_sensleak  # PLACEHOLDER
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.wh_notifications_enabled
      state: "on"
  action:
    - service: notify.wh_household
      data:
        message: >
          Leak detected: {{ trigger.to_state.attributes.friendly_name or trigger.entity_id }}.

- alias: "Night Path: Light on Motion"
  id: wh_night_path_light
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.wh_hallway_sensmot  # PLACEHOLDER: motion sensor
      to: "on"
  condition:
    - condition: sun
      after: sunset
      before: sunrise
    - condition: state
      entity_id: input_boolean.wh_notifications_enabled
      state: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.wh_hallway_path_light  # PLACEHOLDER
      data:
        brightness_pct: 20

- alias: "Quiet Hours: Lower Sonos Volume"
  id: wh_quiet_hours_lower_sonos
  trigger:
    - platform: time
      at: "22:30:00"
  action:
    - service: media_player.volume_set
      target:
        entity_id:
          - media_player.wh_lr_speaker1_media  # PLACEHOLDER
          - media_player.wh_kit_speaker1_media  # PLACEHOLDER
      data:
        volume_level: 0.10

- alias: "Copresence Nudge: Low Time Together"
  id: wh_copresence_nudge_low_time
  mode: single
  trigger:
    - platform: time
      at: "21:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.wh_notifications_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.wh_privacy_mode
      state: "off"
    - condition: template
      value_template: >
        {{ states('sensor.wh_copresence_hours_today')|float(0)
           < states('input_number.wh_copresence_min_hours_today')|float(0) }}
  action:
    - service: notify.wh_household
      data:
        message: >
          Copresence check-in: today was {{ states('sensor.wh_copresence_hours_today') }} hours together at home.
          Want to protect a small window tonight?

- alias: "Roof Alert: Large Pepperoni Pizza"
  id: wh_roof_pizza_alert
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.wh_roof_pizza_detected  # PLACEHOLDER: e.g. object detection
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.wh_bb_fun_mode
      state: "on"
    - condition: state
      entity_id: input_boolean.wh_notifications_enabled
      state: "on"
  action:
    - service: notify.wh_household
      data:
        message: "Crisis at the gable. Pizza on the roof."

- alias: "Basement Air: Turn On Vent Fan"
  id: wh_basement_air_vent_fan_on
  mode: restart
  trigger:
    - platform: numeric_state
      entity_id: sensor.wh_basement_voc_sensvoc  # PLACEHOLDER
      above: 600
    - platform: numeric_state
      entity_id: sensor.wh_basement_humidity_senshum  # PLACEHOLDER
      above: 70
  condition:
    - condition: state
      entity_id: input_boolean.wh_notifications_enabled
      state: "on"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.wh_basement_vent_fan_switch  # PLACEHOLDER
    - service: notify.wh_household
      data:
        message: >
          Basement air safety: ventilation turned on.
          VOC={{ states('sensor.wh_basement_voc_sensvoc') }},
          Humidity={{ states('sensor.wh_basement_humidity_senshum') }}.
