# White House Example - Helpers
# PLACEHOLDER: Replace entity IDs with your own before use.
# See docs/examples/white-house/README.md

input_boolean:
  wh_notifications_enabled:
    name: "Notifications Enabled"
    icon: mdi:bell

  wh_privacy_mode:
    name: "Privacy Mode"
    icon: mdi:shield-lock

input_number:
  wh_copresence_min_hours_today:
    name: "Copresence Minimum Hours Today"
    min: 0
    max: 12
    step: 0.5
    unit_of_measurement: "h"
    icon: mdi:timer

# PLACEHOLDER: Add your notify platform (e.g., mobile_app, notify) to use wh_household
notify:
  - platform: group
    name: wh_household
    services: []  # Add your notify entities, e.g. - notify.mobile_app_phone
