# White House Example - Sonos Routines
# PLACEHOLDER: Replace media_player entities and playlist IDs with your own.
# See docs/examples/white-house/README.md

wh_morning_music:
  alias: "Morning Music"
  sequence:
    - service: media_player.volume_set
      target:
        entity_id: media_player.wh_lr_speaker1_media  # PLACEHOLDER
      data:
        volume_level: 0.18
    - service: media_player.play_media
      target:
        entity_id: media_player.wh_lr_speaker1_media
      data:
        media_content_id: "spotify:playlist:YOUR_PLAYLIST_ID"  # PLACEHOLDER
        media_content_type: "music"
